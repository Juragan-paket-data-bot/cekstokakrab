<!DOCTYPE html>
<html lang="id">
<head>

    <!-- Viewport mengizinkan zoom in (sampai 5x), tapi mencegah zoom out melebihi skala awal (1.0) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#041016">
    <title>Sistem Juragan Paket Data</title>
    
    <!-- Memuat Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Memuat Font Google (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Memuat Ikon FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { 
                        brand: {
                            main: '#00f47e',   // Hijau Neon Terang
                            dark: '#00c765',   // Hijau Hover
                            glow: 'rgba(0, 244, 126, 0.3)'
                        },
                        dark: {
                            bg: '#041016',     // Latar belakang paling gelap
                            card: '#0b1a24',   // Latar kotak/kartu utama
                            input: '#122533',  // Latar input dan kartu dalam
                            border: '#1a3245'  // Garis batas gelap
                        }
                    },
                    animation: {
                        'marquee': 'marquee 250s linear infinite',
                    },
                    keyframes: {
                        marquee: {
                            '0%': { transform: 'translateX(0)' },
                            '100%': { transform: 'translateX(-100%)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Mematikan Spinner pada input angka (Simbol Putih atas-bawah) */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        /* PERBAIKAN: Mengembalikan fungsi scroll sentuh (touch scroll) normal */
        body, html {
            width: 100%; 
            max-width: 100%;
            /* Hanya kunci scroll horizontal (kiri-kanan) */
            overflow-x: hidden; 
            margin: 0;
            padding: 0;
        }
        
        /* Modifikasi Scrollbar Custom */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1a3245; border-radius: 4px; }
    </style>
</head>

<!-- Menggunakan min-h-[100dvh] agar menyesuaikan tinggi layar HP asli (termasuk address bar) -->
<body class="bg-dark-bg text-gray-200 antialiased flex flex-col font-sans selection:bg-brand-main selection:text-black w-full relative min-h-[100dvh]">

    <!-- Top Bar -->
    <div class="shrink-0 bg-[#022214] text-brand-main text-[8px] md:text-[10px] font-bold text-center py-1 md:py-2 tracking-widest border-b border-brand-main/20 w-full">
        <i class="fa-solid fa-circle text-[6px] md:text-[8px] mr-1.5 animate-pulse"></i> SISTEM AKTIF 24 JAM 
        <i class="fa-solid fa-circle text-[6px] md:text-[8px] mx-1.5 opacity-50"></i> PROSES INSTAN DETIK ITU JUGA!
    </div>

    <!-- Running Text Transaksi -->
    <div class="shrink-0 w-full bg-dark-bg/80 border-b border-dark-border py-1.5 md:py-2 flex items-center relative overflow-hidden">
        <div class="absolute left-0 w-6 md:w-12 h-full bg-gradient-to-r from-dark-bg to-transparent z-10 pointer-events-none"></div>
        <div class="absolute right-0 w-6 md:w-12 h-full bg-gradient-to-l from-dark-bg to-transparent z-10 pointer-events-none"></div>
        <div class="flex whitespace-nowrap animate-marquee items-center" id="runningTextContainer">
            <!-- Data dari JS -->
        </div>
    </div>

    <!-- Navigasi -->
    <nav class="shrink-0 w-full max-w-5xl mx-auto px-4 md:px-8 py-3 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-9 h-9 md:w-11 md:h-11 bg-brand-main rounded-lg md:rounded-xl flex items-center justify-center text-dark-bg shadow-[0_0_15px_rgba(0,244,126,0.5)] transform -rotate-6">
                <i class="fa-solid fa-bolt text-lg md:text-2xl transform rotate-6"></i>
            </div>
            <div class="flex flex-col ml-1">
                <span class="text-white font-extrabold text-[14px] md:text-xl leading-none md:leading-tight tracking-tight">JURAGAN PAKET DATA</span>
                <span class="text-brand-main text-[7px] md:text-[10px] font-bold tracking-[0.15em] opacity-80 uppercase mt-0.5">PPOB Automations</span>
            </div>
        </div>
        <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-brand-main/30 bg-brand-main/10 text-brand-main text-[10px] md:text-sm font-semibold">
            <i class="fa-solid fa-bolt text-[9px] md:text-xs"></i>
            <span>Online</span>
        </div>
    </nav>

    <!-- Kontainer Aplikasi -->
    <div class="flex-1 w-full max-w-5xl mx-auto px-4 md:px-8 pb-36 md:pb-32 flex flex-col mt-4 md:mt-6">
        
        <div class="bg-dark-card rounded-2xl md:rounded-3xl shadow-2xl border border-dark-border flex flex-col overflow-hidden relative w-full mb-8">
            
            <!-- Tab Navigasi - Ditambahkan Tab ke-3 (Cek Area) -->
            <div class="flex border-b border-dark-border bg-dark-bg/50 h-12 md:h-14 w-full">
                <button id="tabBtnStok" class="flex-1 text-[10px] md:text-base font-semibold text-brand-main border-b-2 border-brand-main bg-brand-main/5 transition-all flex items-center justify-center gap-1 md:gap-1.5 outline-none">
                    <i class="fa-solid fa-boxes-stacked"></i>Stok Akrab
                </button>
                <button id="tabBtnKuota" class="flex-1 text-[10px] md:text-base font-semibold text-gray-500 border-b-2 border-transparent hover:text-gray-300 transition-all flex items-center justify-center gap-1 md:gap-1.5 outline-none">
                    <i class="fa-solid fa-mobile-screen"></i>Cek Kuota
                </button>
                <button id="tabBtnArea" class="flex-1 text-[10px] md:text-base font-semibold text-gray-500 border-b-2 border-transparent hover:text-gray-300 transition-all flex items-center justify-center gap-1 md:gap-1.5 outline-none">
                    <i class="fa-solid fa-map-location-dot"></i>Cek Area
                </button>
            </div>

            <!-- ============================================== -->
            <!-- TAB: STOK AKRAB -->
            <!-- ============================================== -->
            <div id="tabContentStok" class="flex flex-col p-4 md:p-6 w-full relative">
                
                <div id="loadingStok" class="hidden absolute inset-0 z-20 bg-dark-card/90 flex-col items-center justify-center gap-3 rounded-b-2xl">
                    <i class="fa-solid fa-boxes-packing fa-bounce text-3xl text-brand-main"></i>
                    <span class="text-brand-main text-xs font-medium animate-pulse">Memuat...</span>
                </div>
                
                <!-- GRID STOK -->
                <div class="w-full">
                    <div id="stokGrid" class="grid grid-cols-3 md:grid-cols-5 gap-3 md:gap-5 content-start w-full">
                        <!-- Item stok di-inject via JS -->
                    </div>
                </div>

                <!-- Tombol Refresh -->
                <div class="mt-8 mb-12 md:mb-16 px-1 w-full max-w-md mx-auto">
                    <button id="btnCekStok" class="w-full bg-brand-main hover:bg-brand-dark text-dark-bg font-bold py-4 rounded-xl shadow-[0_0_15px_rgba(0,244,126,0.2)] transition-all active:scale-95 flex items-center justify-center gap-2 outline-none">
                        <i class="fa-solid fa-rotate text-sm md:text-base"></i>
                        <span class="text-sm md:text-base">Muat Data Stok Realtime</span>
                    </button>
                </div>
            </div>

            <!-- ============================================== -->
            <!-- TAB: CEK KUOTA -->
            <!-- ============================================== -->
            <div id="tabContentKuota" class="hidden flex-col p-4 md:p-6 bg-dark-bg/30 w-full relative">
                <form id="cekForm" class="relative w-full max-w-lg mx-auto mb-4">
                    <div class="flex gap-2 w-full">
                        <input type="number" id="inputNomor" placeholder="Contoh: 087812345678" required pattern="\d*"
                            class="w-full min-w-0 flex-1 px-4 py-3 bg-dark-input border border-dark-border rounded-xl focus:outline-none focus:ring-1 focus:ring-brand-main focus:border-brand-main transition-all font-medium text-white placeholder-gray-500 text-base md:text-base">
                        <button type="submit" id="btnSubmit" 
                            class="shrink-0 bg-brand-main hover:bg-brand-dark text-dark-bg font-bold px-4 rounded-xl shadow-[0_0_15px_rgba(0,244,126,0.3)] transition-all active:scale-95 flex items-center justify-center outline-none">
                            <span class="text-sm">Cek</span>
                            <i class="fa-solid fa-arrow-right ml-1 text-sm"></i>
                        </button>
                    </div>
                </form>

                <div id="loading" class="hidden mt-8 flex-col items-center justify-center gap-3">
                    <i class="fa-solid fa-circle-notch fa-spin text-3xl text-brand-main"></i>
                    <span class="text-brand-main text-xs animate-pulse tracking-wide">Mencari...</span>
                </div>
                
                <div id="errorMsg" class="hidden mt-4 w-full max-w-lg mx-auto bg-red-500/10 border border-red-500/30 text-red-400 p-3 rounded-xl text-[11px] md:text-xs items-center gap-2">
                    <i class="fa-solid fa-circle-exclamation shrink-0"></i>
                    <span id="errorText">Nomor yang diinput salah atau sistem sedang dalam gangguan.</span>
                </div>

                <!-- Hasil Cek Kuota -->
                <div id="resultArea" class="hidden flex-col gap-4 w-full mt-2">
                    <!-- Info Kartu -->
                    <div class="bg-dark-card p-4 rounded-2xl border border-dark-border shadow-lg w-full">
                        <h2 class="text-sm font-bold text-white mb-3 border-b border-dark-border pb-2 flex items-center gap-2">
                            <i class="fa-solid fa-address-card text-brand-main"></i> Info Kartu
                        </h2>
                        
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 w-full">
                            <div class="bg-dark-input p-2.5 rounded-xl border border-dark-border">
                                <span class="text-[9px] text-gray-500 font-bold uppercase tracking-wider block mb-1">Nomor</span>
                                <span id="resNomor" class="font-bold text-white text-xs md:text-sm truncate block w-full">-</span>
                            </div>
                            <div class="bg-dark-input p-2.5 rounded-xl border border-dark-border">
                                <span class="text-[9px] text-gray-500 font-bold uppercase tracking-wider block mb-1">Operator</span>
                                <span id="resOperator" class="font-bold text-brand-main text-xs md:text-sm truncate block w-full">-</span>
                            </div>
                            <div class="bg-dark-input p-2.5 rounded-xl border border-dark-border">
                                <span class="text-[9px] text-gray-500 font-bold uppercase tracking-wider block mb-1">Masa Aktif</span>
                                <span id="resExp" class="font-bold text-white text-xs md:text-sm truncate block w-full">-</span>
                            </div>
                            <div class="bg-dark-input p-2.5 rounded-xl border border-red-500/20">
                                <span class="text-[9px] text-red-400/80 font-bold uppercase tracking-wider block mb-1">Masa Tenggang</span>
                                <span id="resGrace" class="font-bold text-red-400 text-xs md:text-sm truncate block w-full">-</span>
                            </div>
                        </div>
                    </div>

                    <!-- Container Paket Aktif -->
                    <div class="bg-dark-card p-4 rounded-2xl border border-dark-border shadow-lg w-full">
                        <h2 class="text-sm font-bold text-white mb-3 border-b border-dark-border pb-2 flex items-center gap-2">
                            <i class="fa-solid fa-box-open text-brand-main"></i> Rincian Paket Aktif
                        </h2>
                        <div id="packagesContainer" class="flex flex-col gap-4 w-full">
                            <!-- Paket di-load via JS -->
                        </div>
                    </div>

                </div>
            </div> <!-- Akhir Tab Cek Kuota -->

            <!-- ============================================== -->
            <!-- TAB: CEK AREA (FITUR BARU) -->
            <!-- ============================================== -->
            <div id="tabContentArea" class="hidden flex-col p-4 md:p-6 bg-dark-bg/30 w-full relative">

                <div class="relative w-full max-w-4xl mx-auto mb-4">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-500"></i>
                    <input type="text" id="inputSearchArea" placeholder="Ketik Kota, Kabupaten, atau Provinsi..." 
                        class="w-full pl-10 pr-4 py-3 bg-dark-input border border-dark-border rounded-xl focus:outline-none focus:ring-1 focus:ring-brand-main focus:border-brand-main transition-all font-medium text-white placeholder-gray-500 text-xs md:text-sm">
                </div>

                <!-- Container Hasil Pencarian (Berbentuk Tabel Klasik) -->
                <div class="w-full max-w-4xl mx-auto mt-2 overflow-x-auto rounded-xl border border-dark-border bg-dark-card shadow-lg mb-8">
                    <table class="w-full text-left border-collapse min-w-[600px]">
                        <thead class="bg-[#122533] border-b border-dark-border">
                            <tr>
                                <th class="px-4 py-3.5 text-brand-main text-xs font-bold uppercase tracking-wider w-1/4">Provinsi</th>
                                <th class="px-4 py-3.5 text-brand-main text-xs font-bold uppercase tracking-wider w-2/4">Kota / Kabupaten</th>
                                <th class="px-4 py-3.5 text-brand-main text-xs font-bold uppercase tracking-wider text-center w-1/4">Area</th>
                            </tr>
                        </thead>
                        <tbody id="areaTableBody" class="divide-y divide-dark-border/50">
                            <!-- Item area di-inject via JS -->
                        </tbody>
                    </table>
                </div>

            </div> <!-- Akhir Tab Cek Area -->

        </div>
    </div>

        function renderTableArea(data, keyword = '') {
            const container = document.getElementById('areaTableBody');
            
            if (data.length === 0) {
                container.innerHTML = `<tr><td colspan="3" class="text-center text-gray-500 text-xs py-8 italic">Area tidak ditemukan. Silakan coba kata kunci lain.</td></tr>`;
                return;
            }

            // Fungsi untuk mengamankan karakter khusus agar pencarian tidak error (misal jika mengetik tanda kurung)
            const escapeRegExp = (string) => {
                return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            };

            // Fungsi untuk memberikan warna kuning pada kata yang sedang dicari
            const highlight = (text, kw) => {
                if (!kw || kw.trim() === '') return text;
                const safeKw = escapeRegExp(kw);
                const regex = new RegExp(`(${safeKw})`, 'gi');
                // Mengganti kata yang cocok dengan span berwarna kuning tebal
                return text.replace(regex, `<span class="text-yellow-400 font-black bg-yellow-400/10 px-0.5 rounded shadow-sm">$1</span>`);
            };
            
            // Render menjadi desain Tabel Klasik
            container.innerHTML = data.map(item => `
                <tr class="hover:bg-[#122533]/60 transition-colors">
                    <td class="px-4 py-4 text-white text-[11.5px] md:text-sm font-bold align-top whitespace-nowrap">
                        <i class="fa-solid fa-map-location-dot text-gray-500 mr-1.5"></i>${highlight(item.prov, keyword)}
                    </td>
                    <td class="px-4 py-4 text-gray-300 text-[11px] md:text-xs leading-[1.7] align-top">
                        ${highlight(item.kota, keyword)}
                    </td>
                    <td class="px-4 py-4 align-top text-center">
                        <span class="inline-block bg-brand-main/10 text-brand-main border border-brand-main/30 px-2.5 py-1 rounded-md text-[11px] md:text-xs font-bold whitespace-nowrap shadow-[0_0_8px_rgba(0,244,126,0.15)]">
                            Area ${highlight(item.area, keyword)}
                        </span>
                    </td>
                </tr>
            `).join('');
        }

        // 1. Tampilkan semua data saat dimuat pertama kali
        renderTableArea(dataArea);

                item.area.toLowerCase().includes(keywordLower)

                let name = names[Math.floor(Math.random() * names.length)];
                let pkg = packages[Math.floor(Math.random() * packages.length)];
                let prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
                
                let maskedName = name.substring(0, 2) + "**";
                let phone = `${prefix}****${Math.floor(1000 + Math.random() * 9000)}`;
                
                marqueeHTML += `<span class="mx-3 md:mx-4 text-[9px] md:text-[11px] text-gray-400 font-medium tracking-wide flex items-center h-full"><i class="fa-solid fa-cart-shopping text-brand-main mr-1.5"></i><span class="text-gray-200">${maskedName}</span> &nbsp;<span class="opacity-70">(${phone})</span>&nbsp; sukses membeli &nbsp;<span class="text-brand-main font-bold">${pkg}</span></span><span class="text-dark-border text-[7px] flex items-center h-full">●</span>`;
            }
            document.getElementById('runningTextContainer').innerHTML = marqueeHTML;
        }
        generateFakeTransactions();
    </script>
</body>
</html>
