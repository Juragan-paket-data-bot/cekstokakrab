<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag wajib untuk aplikasi full layar anti-zoom -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#041016">
    <title>Sistem Juragan Paket Data</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { 
                        brand: {
                            main: '#00f47e', 
                            dark: '#00c765', 
                        },
                        dark: {
                            bg: '#041016', 
                            card: '#0b1a24',
                            input: '#122533',
                            border: '#1a3245' 
                        }
                    },
                    animation: { 'marquee': 'marquee 800s linear infinite' },
                    keyframes: {
                        marquee: {
                            '0%': { transform: 'translateX(0)' },
                            '100%': { transform: 'translateX(-100%)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Mematikan Spinner pada input angka */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        /* RESET TOTAL: Halaman tidak bisa di-scroll, full screen lock */
        body {
            overflow: hidden !important; 
            overscroll-behavior: none; /* Anti pull-to-refresh */
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>

<!-- STRUKTUR UTAMA: Flex Column, Tinggi 100% dari layar perangkat (100dvh) -->
<body class="bg-dark-bg h-[100dvh] w-screen flex flex-col text-gray-200 antialiased font-sans selection:bg-brand-main selection:text-black m-0 p-0 overflow-hidden">

    <!-- 1. Top Bar Status (Super Tipis) -->
    <div class="shrink-0 w-full bg-[#022214] text-brand-main text-[8px] md:text-[9px] font-bold text-center py-1 tracking-widest border-b border-brand-main/20">
        <i class="fa-solid fa-circle text-[6px] mr-1.5 animate-pulse"></i> SISTEM AKTIF 24 JAM 
        <i class="fa-solid fa-circle text-[6px] mx-1.5 opacity-50"></i> PROSES INSTAN
    </div>

    <!-- 2. Running Text Transaksi (Super Tipis) -->
    <div class="shrink-0 w-full bg-dark-bg/80 border-b border-dark-border overflow-hidden py-1 flex items-center relative z-10 h-6">
        <div class="absolute left-0 w-8 h-full bg-gradient-to-r from-dark-bg to-transparent z-10 pointer-events-none"></div>
        <div class="absolute right-0 w-8 h-full bg-gradient-to-l from-dark-bg to-transparent z-10 pointer-events-none"></div>
        <div class="flex whitespace-nowrap animate-marquee items-center h-full" id="runningTextContainer"></div>
    </div>

    <!-- 3. Navigasi / Header (Minimalis) -->
    <nav class="shrink-0 w-full px-3 py-1.5 flex justify-between items-center border-b border-dark-border bg-dark-card h-12">
        <div class="flex items-center gap-2">
            <div class="w-7 h-7 bg-brand-main rounded-md flex items-center justify-center text-dark-bg shadow-[0_0_10px_rgba(0,244,126,0.5)] transform -rotate-6">
                <i class="fa-solid fa-bolt text-sm transform rotate-6"></i>
            </div>
            <div class="flex flex-col justify-center">
                <span class="text-white font-extrabold text-[13px] leading-none tracking-tight">JURAGAN PAKET DATA</span>
                <span class="text-brand-main text-[7px] font-bold tracking-widest opacity-80 uppercase mt-0.5">PPOB Automations</span>
            </div>
        </div>
        <div class="flex items-center gap-1.5 px-2 py-1 rounded-md border border-brand-main/30 bg-brand-main/10 text-brand-main text-[9px] font-semibold">
            <i class="fa-solid fa-bolt"></i> Online
        </div>
    </nav>

    <!-- 4. Tab Navigasi (Super Tipis) -->
    <div class="shrink-0 flex border-b border-dark-border bg-dark-bg/50 w-full h-9">
        <button id="tabBtnStok" class="flex-1 text-[11px] font-bold text-brand-main border-b-[3px] border-brand-main bg-brand-main/5 transition-all outline-none uppercase tracking-wider">
            Stok Akrab
        </button>
        <button id="tabBtnKuota" class="flex-1 text-[11px] font-bold text-gray-500 border-b-[3px] border-transparent hover:text-gray-300 transition-all outline-none uppercase tracking-wider">
            Cek Kuota
        </button>
    </div>

    <!-- 5. KONTEN UTAMA: Mengambil seluruh sisa ruang kosong (flex-1) -->
    <div class="flex-1 w-full relative overflow-hidden bg-dark-card min-h-0">
        
        <!-- ============================================== -->
        <!-- TAB: STOK AKRAB (Grid Padat Tanpa Scroll) -->
        <!-- ============================================== -->
        <div id="tabContentStok" class="absolute inset-0 flex flex-col p-1.5 md:p-3 overflow-hidden">
            
            <!-- Loading & Error -->
            <div id="loadingStok" class="hidden h-full flex-col items-center justify-center gap-2">
                <i class="fa-solid fa-spinner fa-spin text-2xl text-brand-main"></i>
                <span class="text-brand-main text-[10px] font-medium">Memuat Data...</span>
            </div>
            <div id="errorMsgStok" class="hidden h-full items-center justify-center text-red-400 text-xs text-center p-4">
                <span id="errorTextStok">Gagal memuat.</span>
            </div>

            <!-- GRID 3 KOLOM 4 BARIS (Membentuk 10 Kotak Penuh di Layar) -->
            <div id="resultAreaStok" class="flex-1 w-full h-full min-h-0">
                <div id="stokGrid" class="grid grid-cols-3 grid-rows-4 gap-1.5 h-full w-full">
                    <!-- Item Disisipkan dari JS -->
                </div>
            </div>

            <!-- TOMBOL REFRESH (Paling Bawah, Tipis) -->
            <div class="shrink-0 mt-1.5 w-full">
                <button id="btnCekStok" class="w-full bg-brand-main hover:bg-brand-dark text-dark-bg font-bold py-2 rounded-md shadow-[0_0_10px_rgba(0,244,126,0.2)] transition-all active:scale-95 flex items-center justify-center gap-1.5 text-[10px] outline-none">
                    <i class="fa-solid fa-rotate"></i> Refresh Stok
                </button>
            </div>
        </div>

        <!-- ============================================== -->
        <!-- TAB: CEK KUOTA (Bisa Di-Scroll Normal Jika Panjang) -->
        <!-- ============================================== -->
        <div id="tabContentKuota" class="absolute inset-0 hidden overflow-y-auto p-4 pb-10 bg-dark-bg">
            <!-- Form -->
            <form id="cekForm" class="w-full mb-5">
                <div class="flex gap-2">
                    <input type="number" id="inputNomor" placeholder="Cth: 08781234..." required pattern="\d*"
                        class="flex-1 w-full px-3 py-2.5 bg-dark-input border border-dark-border rounded-lg focus:outline-none focus:border-brand-main text-white placeholder-gray-500 text-[14px]">
                    <button type="submit" id="btnSubmit" class="bg-brand-main text-dark-bg font-bold px-4 py-2.5 rounded-lg active:scale-95 flex items-center justify-center shrink-0 text-xs">
                        Cek <i class="fa-solid fa-arrow-right ml-1"></i>
                    </button>
                </div>
            </form>

            <div id="loading" class="hidden my-8 flex-col items-center justify-center gap-2">
                <i class="fa-solid fa-circle-notch fa-spin text-2xl text-brand-main"></i>
                <span class="text-brand-main text-xs">Menghubungkan...</span>
            </div>
            
            <div id="errorMsg" class="hidden mb-4 bg-red-500/10 border border-red-500/30 text-red-400 p-3 rounded-lg text-xs flex items-center gap-2">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="errorText">Gagal.</span>
            </div>

            <div id="resultArea" class="hidden flex-col gap-4">
                <!-- Info Kartu -->
                <div class="p-3 rounded-xl border border-dark-border bg-dark-card">
                    <h2 class="text-xs font-bold text-white mb-2 border-b border-dark-border pb-1">Info Kartu</h2>
                    <div class="grid grid-cols-2 gap-2">
                        <div class="bg-dark-input p-2 rounded-md"><span class="text-[8px] text-gray-500 block">Nomor</span><span id="resNomor" class="font-bold text-white text-[10px] break-all">-</span></div>
                        <div class="bg-dark-input p-2 rounded-md"><span class="text-[8px] text-gray-500 block">Operator</span><span id="resOperator" class="font-bold text-brand-main text-[10px]">-</span></div>
                        <div class="bg-dark-input p-2 rounded-md"><span class="text-[8px] text-gray-500 block">Masa Aktif</span><span id="resExp" class="font-bold text-white text-[10px]">-</span></div>
                        <div class="bg-dark-input p-2 rounded-md border border-red-500/20"><span class="text-[8px] text-red-400/80 block">Masa Tenggang</span><span id="resGrace" class="font-bold text-red-400 text-[10px]">-</span></div>
                    </div>
                </div>

                <!-- Detail Paket -->
                <div>
                    <h2 class="text-xs font-bold text-white mb-2 px-1">Detail Paket Aktif</h2>
                    <div id="packagesContainer" class="flex flex-col gap-3">
                        <!-- Paket di-load via JS -->
                    </div>
                </div>
            </div> 
        </div> <!-- Akhir Tab Cek Kuota -->
        
    </div>

    <script>
        // Data Mockup Preview
        const mockDataPreview = {
            "success":true,"code":"000","message":"Sukses","data":{"subs_info":{"msisdn":"6287812345678","operator":"XL","net_type":"4G","exp_date":"06-03-2037","grace_until":"31-12-2035"},"package_info":{"error_message":null,"packages":[
                { "name":"Akrab Mini 10GB", "expiry":"31-12-2049", "quotas":[{"name":"Kuota Bersama","percent":80,"total":"10GB","remaining":"8GB"}] },
                { "name":"Extra Kuota Tiktok", "expiry":"31-12-2024", "quotas":[{"name":"Kuota Tiktok 24 Jam","percent":25,"total":"5GB","remaining":"1.2GB"}] }
            ]}}
        };

        const mockStokPreview = {
            "success": true,
            "data": [
                { "sku": "XLA14", "nama": "SuperMini", "stok": "10" },
                { "sku": "XLA20", "nama": "SuperMini V2", "stok": "0" },
                { "sku": "XLA32", "nama": "Mini", "stok": "313" },
                { "sku": "XLA39", "nama": "Big", "stok": "844" },
                { "sku": "XLA48", "nama": "Big V2", "stok": "252" },
                { "sku": "XLA55", "nama": "Jumbo V2", "stok": "525" },
                { "sku": "XLA64", "nama": "Jumbo V3", "stok": "351" },
                { "sku": "XLA65", "nama": "JUMBO", "stok": "2" },
                { "sku": "XLA77", "nama": "Megabig V2", "stok": "313" },
                { "sku": "XLA89", "nama": "MegaBig", "stok": "279" }
            ]
        };

        // Pengelolaan Tab
        const tabBtnKuota = document.getElementById('tabBtnKuota');
        const tabBtnStok = document.getElementById('tabBtnStok');
        const tabContentKuota = document.getElementById('tabContentKuota');
        const tabContentStok = document.getElementById('tabContentStok');

        function switchTab(activeBtn, inactiveBtn, activeContent, inactiveContent) {
            activeBtn.classList.add('text-brand-main', 'border-brand-main', 'bg-brand-main/5');
            activeBtn.classList.remove('text-gray-500', 'border-transparent', 'hover:text-gray-300');
            inactiveBtn.classList.remove('text-brand-main', 'border-brand-main', 'bg-brand-main/5');
            inactiveBtn.classList.add('text-gray-500', 'border-transparent', 'hover:text-gray-300');
            activeContent.classList.remove('hidden');
            inactiveContent.classList.add('hidden');
            
            if(activeContent.id === 'tabContentStok') {
                activeContent.classList.add('flex');
            } else {
                activeContent.classList.add('block');
            }
            inactiveContent.classList.remove('flex', 'block');
        }

        tabBtnKuota.addEventListener('click', () => switchTab(tabBtnKuota, tabBtnStok, tabContentKuota, tabContentStok));
        tabBtnStok.addEventListener('click', () => switchTab(tabBtnStok, tabBtnKuota, tabContentStok, tabContentKuota));

        // Form Cek Kuota
        document.getElementById('cekForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const nomor = document.getElementById('inputNomor').value;
            const loading = document.getElementById('loading');
            const errorMsg = document.getElementById('errorMsg');
            const resultArea = document.getElementById('resultArea');
            const btnSubmit = document.getElementById('btnSubmit');
            const btnIcon = btnSubmit.querySelector('i');

            errorMsg.classList.add('hidden');
            resultArea.classList.add('hidden');
            resultArea.classList.remove('flex');
            loading.classList.remove('hidden');
            loading.classList.add('flex');
            btnSubmit.disabled = true;
            btnSubmit.classList.add('opacity-70');
            btnIcon.className = 'fa-solid fa-spinner fa-spin ml-1';

            try {
                let responseData;
                const isVercel = window.location.hostname.includes('vercel.app') || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
                
                if (isVercel) {
                    const response = await fetch(`/api/checker?number=${nomor}`);
                    if (!response.ok) throw new Error("Gagal terhubung");
                    responseData = await response.json();
                } else {
                    await new Promise(r => setTimeout(r, 1000));
                    responseData = mockDataPreview; 
                    responseData.data.subs_info.msisdn = nomor;
                }

                if (responseData.data && responseData.data.subs_info) {
                    const info = responseData.data.subs_info;
                    const packagesArray = responseData.data.package_info.packages;

                    document.getElementById('resNomor').textContent = info.msisdn || '-';
                    document.getElementById('resOperator').textContent = info.operator || '-';
                    document.getElementById('resExp').textContent = info.exp_date || '-';
                    document.getElementById('resGrace').textContent = info.grace_until || '-';

                    const packagesContainer = document.getElementById('packagesContainer');
                    packagesContainer.innerHTML = ''; 

                    if (packagesArray && packagesArray.length > 0) {
                        packagesArray.forEach(paket => {
                            let packageHTML = `
                                <div class="bg-dark-input p-3 rounded-lg border border-dark-border">
                                    <div class="flex justify-between items-center mb-2 pb-1 border-b border-dark-border/50">
                                        <h3 class="text-[10px] font-bold text-white">${paket.name}</h3>
                                        <span class="text-[8px] text-gray-400">Exp: ${paket.expiry}</span>
                                    </div>
                                    <div class="grid grid-cols-1 gap-2">
                            `;
                            if (paket.quotas && paket.quotas.length > 0) {
                                paket.quotas.forEach(kuota => {
                                    const percent = kuota.percent || 100;
                                    let barColor = percent <= 20 ? 'bg-red-500' : (percent <= 50 ? 'bg-yellow-400' : 'bg-brand-main');
                                    packageHTML += `
                                        <div class="bg-dark-bg border border-dark-border rounded-md p-2">
                                            <h4 class="text-[8px] text-gray-200 mb-1 truncate">${kuota.name}</h4>
                                            <div class="flex justify-between items-end mb-1">
                                                <span class="text-[10px] font-bold text-brand-main leading-none">${kuota.remaining}</span>
                                                <span class="text-[7px] text-gray-400">${kuota.total}</span>
                                            </div>
                                            <div class="w-full bg-dark-input rounded-full h-1"><div class="${barColor} h-1 rounded-full" style="width: ${percent}%"></div></div>
                                        </div>
                                    `;
                                });
                            }
                            packageHTML += `</div></div>`;
                            packagesContainer.insertAdjacentHTML('beforeend', packageHTML);
                        });
                    }
                    resultArea.classList.remove('hidden');
                    resultArea.classList.add('flex');
                } else { throw new Error("Invalid"); }
            } catch (error) {
                document.getElementById('errorText').textContent = "Gagal memuat detail nomor.";
                errorMsg.classList.remove('hidden');
                errorMsg.classList.add('flex');
            } finally {
                loading.classList.add('hidden');
                loading.classList.remove('flex');
                btnSubmit.disabled = false;
                btnSubmit.classList.remove('opacity-70');
                btnIcon.className = 'fa-solid fa-arrow-right ml-1';
            }
        });

        // Load Data Stok
        async function loadStokData() {
            const loadingStok = document.getElementById('loadingStok');
            const errorMsgStok = document.getElementById('errorMsgStok');
            const resultAreaStok = document.getElementById('resultAreaStok');
            const btnCekStok = document.getElementById('btnCekStok');
            const btnIcon = btnCekStok.querySelector('i');

            errorMsgStok.classList.add('hidden');
            resultAreaStok.classList.add('invisible'); // Gunakan invisible agar tinggi flex tetap terjaga
            loadingStok.classList.remove('hidden');
            loadingStok.classList.add('flex');
            btnIcon.classList.add('fa-spin');

            try {
                let responseData;
                const isVercel = window.location.hostname.includes('vercel.app') || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
                
                if (isVercel) {
                    const response = await fetch(`/api/stok-akrab`);
                    if (!response.ok) throw new Error("Gagal");
                    responseData = await response.json();
                } else {
                    await new Promise(r => setTimeout(r, 600));
                    responseData = mockStokPreview; 
                }

                const stokGrid = document.getElementById('stokGrid');
                stokGrid.innerHTML = ''; 
                
                let stockItems = [];
                let dataToParse = responseData.data || responseData;

                const kamusPaket = {
                    'XLA14': 'SuperMini', 'XLA20': 'SuperMini V2', 'XLA32': 'Mini', 
                    'XLAP39': 'Big (Promo)', 'XLA39': 'Big', 'XLAP48': 'Big V2 (Promo)', 
                    'XLA48': 'Big V2', 'XLAP55': 'Jumbo V2 (Promo)', 'XLA55': 'Jumbo V2', 
                    'XLAP64': 'Jumbo V3 (Promo)', 'XLA64': 'Jumbo V3', 'XLAP77': 'MegaBig v2 (Promo)', 
                    'XLA77': 'Megabig V2', 'XLAP89': 'MegaBig (Promo)', 'XLA65': 'JUMBO', 'XLA89': 'MegaBig'
                };

                const detailAreaPaket = {
                    "SuperMini": [{ area: "Area1", quota: "13-15 GB" }, { area: "Area2", quota: "15-17 GB" }, { area: "Area3", quota: "20-22 GB" }, { area: "Area4", quota: "30-32 GB" }],
                    "SuperMini V2": [{ area: "Area1", quota: "19-21 GB" }, { area: "Area2", quota: "21-23 GB" }, { area: "Area3", quota: "26-28 GB" }, { area: "Area4", quota: "36-38 GB" }],
                    "Mini": [{ area: "Area1", quota: "31-32 GB" }, { area: "Area2", quota: "33-34 GB" }, { area: "Area3", quota: "38-39 GB" }, { area: "Area4", quota: "48-49 GB" }],
                    "Big": [{ area: "Area1", quota: "38-40 GB" }, { area: "Area2", quota: "40-42 GB" }, { area: "Area3", quota: "45-47 GB" }, { area: "Area4", quota: "55-57 GB" }],
                    "Big V2": [{ area: "Area1", quota: "48 GB" }, { area: "Area2", quota: "50 GB" }, { area: "Area3", quota: "55 GB" }, { area: "Area4", quota: "65 GB" }],
                    "Jumbo V2": [{ area: "Area1", quota: "55 GB" }, { area: "Area2", quota: "57 GB" }, { area: "Area3", quota: "62 GB" }, { area: "Area4", quota: "72 GB" }],
                    "Jumbo V3": [{ area: "Area1", quota: "63-65 GB" }, { area: "Area2", quota: "65-67 GB" }, { area: "Area3", quota: "70-72 GB" }, { area: "Area4", quota: "80-82 GB" }],
                    "JUMBO": [{ area: "Area1", quota: "65 GB" }, { area: "Area2", quota: "70 GB" }, { area: "Area3", quota: "83 GB" }, { area: "Area4", quota: "123 GB" }],
                    "Megabig V2": [{ area: "Area1", quota: "76-78 GB" }, { area: "Area2", quota: "78-80 GB" }, { area: "Area3", quota: "83-85 GB" }, { area: "Area4", quota: "93-95 GB" }],
                    "MegaBig": [{ area: "Area1", quota: "88-90 GB" }, { area: "Area2", quota: "90-92 GB" }, { area: "Area3", quota: "95-97 GB" }, { area: "Area4", quota: "105-107 GB" }]
                };

                if (Array.isArray(dataToParse)) {
                    stockItems = dataToParse.map(item => {
                        let valCode = item.sku || item.kode || item.code || item.id || '-';
                        let valStock = item.stok || item.stock || item.qty || null;
                        let valName = item.nama || item.name || '';
                        if (!valName || valName === valStock) valName = kamusPaket[valCode] || valCode;
                        let numStock = typeof valStock === 'string' ? (parseInt(valStock.replace(/\D/g, '')) || 0) : parseInt(valStock || 0);
                        return { code: valCode, name: valName, stock: valStock, numStock: numStock };
                    });
                } else if (typeof dataToParse === 'object') {
                    for (const [key, value] of Object.entries(dataToParse)) {
                        let valCode = key, valStock = value, valName = kamusPaket[key] || key;
                        if (typeof value === 'object' && value !== null) {
                            valCode = value.sku || key; valName = value.nama || valName; valStock = value.stok || 0;
                        }
                        let numStock = typeof valStock === 'string' ? parseInt(String(valStock).replace(/\D/g, '')) || 0 : parseInt(valStock || 0);
                        stockItems.push({ code: valCode, name: valName, stock: valStock, numStock: numStock });
                    }
                }

                if (stockItems.length > 0) {
                    stockItems.forEach(item => {
                        const isAvailable = item.numStock > 0 || String(item.stock).toLowerCase().includes('tersedia');
                        const stockColor = isAvailable ? 'text-brand-main' : 'text-red-500';
                        
                        // Icon Sangat Kecil
                        const checkIcon = isAvailable 
                            ? `<div class="bg-brand-main rounded-full w-2.5 h-2.5 flex items-center justify-center"><i class="fa-solid fa-check text-black text-[6px]"></i></div>`
                            : `<div class="bg-red-500 rounded-full w-2.5 h-2.5 flex items-center justify-center"><i class="fa-solid fa-xmark text-black text-[6px]"></i></div>`;
                        
                        const emptyText = !isAvailable ? `<span class="block text-red-500 text-[6px] italic font-black mt-0.5">HABIS</span>` : '';

                        let baseNameForArea = item.name.replace(' (Promo)', '').trim();
                        if(baseNameForArea.toLowerCase() === 'megabig v2') baseNameForArea = 'Megabig V2'; 
                        
                        let areaHTML = '';
                        const areas = detailAreaPaket[baseNameForArea];
                        if (areas) {
                            areaHTML = `<div class="flex flex-col flex-1 mt-1 justify-center">`;
                            areas.forEach(a => {
                                // Teks Abu-abu dan Kuning Emas Super Rapat
                                areaHTML += `<div class="flex justify-between items-center w-full"><span class="text-[7px] text-gray-400 leading-tight">${a.area}</span><span class="text-[#e8b923] text-[7px] font-bold leading-tight">${a.quota}</span></div>`;
                            });
                            areaHTML += `</div>`;
                        } else { 
                            areaHTML = `<div class="flex-1"></div>`; 
                        }

                        // Kartu Grid Super Tipis (Padding sangat minimal untuk menghemat tinggi)
                        const card = `
                            <div class="bg-dark-input p-1.5 rounded-lg border border-dark-border flex flex-col h-full w-full overflow-hidden">
                                <div class="flex justify-between items-start mb-0.5 gap-1">
                                    <h3 class="font-extrabold text-white text-[9px] leading-none truncate">${item.name}</h3>
                                    <div class="shrink-0">${checkIcon}</div>
                                </div>
                                <div class="mb-0.5 relative z-10">
                                    <div class="flex items-center gap-1">
                                        <span class="text-white font-bold text-[8px]">Stok:</span>
                                        <span class="text-[11px] font-extrabold ${stockColor} leading-none">${item.numStock}</span>
                                    </div>
                                    ${emptyText}
                                </div>
                                ${areaHTML}
                                <div class="mt-auto pt-1 border-t border-[#1a3245] flex justify-between items-center w-full">
                                    <span class="text-[6px] text-gray-500 font-bold tracking-wider">KODE</span>
                                    <span class="text-brand-main text-[7px] font-bold tracking-wider">${item.code}</span>
                                </div>
                            </div>
                        `;
                        stokGrid.insertAdjacentHTML('beforeend', card);
                    });
                }
                resultAreaStok.classList.remove('invisible');
            } catch (error) {
                errorMsgStok.classList.remove('hidden');
                errorMsgStok.classList.add('flex');
            } finally {
                loadingStok.classList.add('hidden');
                loadingStok.classList.remove('flex');
                btnIcon.classList.remove('fa-spin');
            }
        }

        document.getElementById('btnCekStok').addEventListener('click', loadStokData);
        window.addEventListener('DOMContentLoaded', loadStokData);

        // Fake Transaksi
        function generateFakeTransactions() {
            const names = ["Budi", "Andi", "Siti", "Ayu", "Agus", "Dewi", "Reza", "Putri", "Dedi", "Rina", "Eko", "Lia", "Rizky", "Fitri", "Dimas", "Nova", "Hendra"];
            const packages = ["SuperMini", "SuperMini V2", "Mini", "Big", "Big V2", "Jumbo V2", "Jumbo V3", "JUMBO", "Megabig V2", "MegaBig"]; 
            const prefixes = ["0817", "0818", "0819", "0859", "0877", "0878", "0831", "0832", "0833", "0838"];
            
            let marqueeHTML = "";
            for (let i = 0; i < 100; i++) {
                let name = names[Math.floor(Math.random() * names.length)];
                let pkg = packages[Math.floor(Math.random() * packages.length)];
                let prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
                let maskedName = name.substring(0, 2) + "**";
                let phone = `${prefix}****${Math.floor(1000 + Math.random() * 9000)}`;
                
                marqueeHTML += `<span class="mx-4 text-[7px] md:text-[8px] text-gray-400 font-medium"><i class="fa-solid fa-cart-shopping text-brand-main mr-1"></i><span class="text-gray-200">${maskedName}</span> <span class="opacity-70">(${phone})</span> sukses <span class="text-brand-main font-bold">${pkg}</span></span><span class="text-dark-border text-[6px]">●</span>`;
            }
            document.getElementById('runningTextContainer').innerHTML = marqueeHTML;
        }
        generateFakeTransactions();
    </script>
