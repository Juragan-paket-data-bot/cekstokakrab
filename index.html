<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Viewport direvisi: mengizinkan zoom saat mode desktop diaktifkan -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#041016">
    <title>Sistem Juragan Paket Data</title>
    
    <!-- Memuat Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Memuat Font Google (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Memuat Ikon FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { 
                        brand: {
                            main: '#00f47e',   // Hijau Neon Terang
                            dark: '#00c765',   // Hijau Hover
                            glow: 'rgba(0, 244, 126, 0.3)'
                        },
                        dark: {
                            bg: '#041016',     // Latar belakang paling gelap
                            card: '#0b1a24',   // Latar kotak/kartu utama
                            input: '#122533',  // Latar input dan kartu dalam
                            border: '#1a3245'  // Garis batas gelap
                        }
                    },
                    animation: {
                        'marquee': 'marquee 250s linear infinite',
                    },
                    keyframes: {
                        marquee: {
                            '0%': { transform: 'translateX(0)' },
                            '100%': { transform: 'translateX(-100%)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Mematikan Spinner pada input angka (Simbol Putih atas-bawah) */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        /* PERBAIKAN: Mencegah scroll Kiri Kanan & Pull-to-refresh */
        body, html {
            width: 100%; 
            max-width: 100%;
            overflow-x: hidden; /* Mengunci scroll horizontal */
            margin: 0;
            padding: 0;
            overscroll-behavior-y: none; /* Anti pull-to-refresh */
        }
        
        /* Modifikasi Scrollbar Custom */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1a3245; border-radius: 4px; }
    </style>
</head>

<!-- STRUKTUR UTAMA -->
<body class="bg-dark-bg text-gray-200 antialiased flex flex-col font-sans selection:bg-brand-main selection:text-black w-full relative min-h-screen">

    <!-- Top Bar -->
    <div class="shrink-0 bg-[#022214] text-brand-main text-[8px] md:text-[10px] font-bold text-center py-1 md:py-2 tracking-widest border-b border-brand-main/20 w-full">
        <i class="fa-solid fa-circle text-[6px] md:text-[8px] mr-1.5 animate-pulse"></i> SISTEM AKTIF 24 JAM 
        <i class="fa-solid fa-circle text-[6px] md:text-[8px] mx-1.5 opacity-50"></i> PROSES INSTAN DETIK ITU JUGA!
    </div>

    <!-- Running Text Transaksi -->
    <div class="shrink-0 w-full bg-dark-bg/80 border-b border-dark-border py-1.5 md:py-2 flex items-center relative overflow-hidden">
        <div class="absolute left-0 w-6 md:w-12 h-full bg-gradient-to-r from-dark-bg to-transparent z-10 pointer-events-none"></div>
        <div class="absolute right-0 w-6 md:w-12 h-full bg-gradient-to-l from-dark-bg to-transparent z-10 pointer-events-none"></div>
        <div class="flex whitespace-nowrap animate-marquee items-center" id="runningTextContainer">
            <!-- Data dari JS -->
        </div>
    </div>

    <!-- Navigasi -->
    <nav class="shrink-0 w-full max-w-5xl mx-auto px-3 py-3 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-9 h-9 md:w-11 md:h-11 bg-brand-main rounded-lg md:rounded-xl flex items-center justify-center text-dark-bg shadow-[0_0_15px_rgba(0,244,126,0.5)] transform -rotate-6">
                <i class="fa-solid fa-bolt text-lg md:text-2xl transform rotate-6"></i>
            </div>
            <div class="flex flex-col ml-1">
                <span class="text-white font-extrabold text-[14px] md:text-xl leading-none md:leading-tight tracking-tight">JURAGAN PAKET DATA</span>
                <span class="text-brand-main text-[7px] md:text-[10px] font-bold tracking-[0.15em] opacity-80 uppercase mt-0.5">PPOB Automations</span>
            </div>
        </div>
        <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-brand-main/30 bg-brand-main/10 text-brand-main text-[10px] md:text-sm font-semibold">
            <i class="fa-solid fa-bolt text-[9px] md:text-xs"></i>
            <span>Online</span>
        </div>
    </nav>

    <!-- Kontainer Aplikasi -->
    <div class="flex-1 w-full max-w-5xl mx-auto px-2 md:px-4 pb-24 md:pb-12 flex flex-col mt-2">
        
        <div class="bg-dark-card rounded-2xl md:rounded-3xl shadow-2xl border border-dark-border flex flex-col overflow-hidden relative w-full">
            
            <!-- Tab Navigasi -->
            <div class="flex border-b border-dark-border bg-dark-bg/50 h-12 md:h-14 w-full">
                <button id="tabBtnStok" class="flex-1 text-xs md:text-base font-semibold text-brand-main border-b-2 border-brand-main bg-brand-main/5 transition-all flex items-center justify-center gap-1.5 outline-none">
                    <i class="fa-solid fa-boxes-stacked"></i>Stok Akrab
                </button>
                <button id="tabBtnKuota" class="flex-1 text-xs md:text-base font-semibold text-gray-500 border-b-2 border-transparent hover:text-gray-300 transition-all flex items-center justify-center gap-1.5 outline-none">
                    <i class="fa-solid fa-mobile-screen"></i>Cek Kuota
                </button>
            </div>

            <!-- ============================================== -->
            <!-- TAB: STOK AKRAB -->
            <!-- ============================================== -->
            <div id="tabContentStok" class="flex flex-col p-2.5 md:p-4 w-full relative">
                
                <div id="loadingStok" class="hidden absolute inset-0 z-20 bg-dark-card/90 flex-col items-center justify-center gap-3 rounded-b-2xl">
                    <i class="fa-solid fa-boxes-packing fa-bounce text-3xl text-brand-main"></i>
                    <span class="text-brand-main text-xs font-medium animate-pulse">Memuat...</span>
                </div>
                
                <!-- GRID STOK: 3 Kolom. content-start mencegah kelar. gap diperbesar agar lebih jelas. -->
                <div class="w-full">
                    <div id="stokGrid" class="grid grid-cols-3 md:grid-cols-5 gap-2 md:gap-4 content-start w-full">
                        <!-- Item stok di-inject via JS -->
                    </div>
                </div>

                <!-- Tombol Refresh (Di Bawah List) -->
                <div class="mt-6 mb-6 px-1">
                    <button id="btnCekStok" class="w-full bg-brand-main hover:bg-brand-dark text-dark-bg font-bold py-3.5 rounded-xl shadow-[0_0_15px_rgba(0,244,126,0.2)] transition-all active:scale-95 flex items-center justify-center gap-2 outline-none">
                        <i class="fa-solid fa-rotate text-sm md:text-base"></i>
                        <span class="text-sm md:text-base">Muat Data Stok Realtime</span>
                    </button>
                </div>
            </div>

            <!-- ============================================== -->
            <!-- TAB: CEK KUOTA -->
            <!-- ============================================== -->
            <div id="tabContentKuota" class="hidden flex-col p-4 md:p-6 bg-dark-bg/30 w-full relative">
                <form id="cekForm" class="relative w-full max-w-lg mx-auto mb-4">
                    <div class="flex gap-2 w-full">
                        <input type="number" id="inputNomor" placeholder="Contoh: 087812345678" required pattern="\d*"
                            class="w-full min-w-0 flex-1 px-4 py-3 bg-dark-input border border-dark-border rounded-xl focus:outline-none focus:ring-1 focus:ring-brand-main focus:border-brand-main transition-all font-medium text-white placeholder-gray-500 text-sm md:text-base">
                        <button type="submit" id="btnSubmit" 
                            class="shrink-0 bg-brand-main hover:bg-brand-dark text-dark-bg font-bold px-4 rounded-xl shadow-[0_0_15px_rgba(0,244,126,0.3)] transition-all active:scale-95 flex items-center justify-center outline-none">
                            <span class="text-sm">Cek</span>
                            <i class="fa-solid fa-arrow-right ml-1 text-sm"></i>
                        </button>
                    </div>
                </form>

                <div id="loading" class="hidden mt-8 flex-col items-center justify-center gap-3">
                    <i class="fa-solid fa-circle-notch fa-spin text-3xl text-brand-main"></i>
                    <span class="text-brand-main text-xs animate-pulse tracking-wide">Mencari...</span>
                </div>
                
                <div id="errorMsg" class="hidden mt-4 w-full max-w-lg mx-auto bg-red-500/10 border border-red-500/30 text-red-400 p-3 rounded-xl text-xs items-center gap-2">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="errorText">Terjadi kesalahan. Silakan coba lagi.</span>
                </div>

                <!-- Hasil Cek Kuota -->
                <div id="resultArea" class="hidden flex-col gap-4 w-full mt-2">
                    
                    <!-- Info Kartu -->
                    <div class="bg-dark-card p-4 rounded-2xl border border-dark-border shadow-lg w-full">
                        <h2 class="text-sm font-bold text-white mb-3 border-b border-dark-border pb-2 flex items-center gap-2">
                            <i class="fa-solid fa-address-card text-brand-main"></i> Info Kartu
                        </h2>
                        
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 w-full">
                            <div class="bg-dark-input p-2.5 rounded-xl border border-dark-border">
                                <span class="text-[9px] text-gray-500 font-bold uppercase tracking-wider block mb-1">Nomor</span>
                                <span id="resNomor" class="font-bold text-white text-xs md:text-sm truncate block w-full">-</span>
                            </div>
                            <div class="bg-dark-input p-2.5 rounded-xl border border-dark-border">
                                <span class="text-[9px] text-gray-500 font-bold uppercase tracking-wider block mb-1">Operator</span>
                                <span id="resOperator" class="font-bold text-brand-main text-xs md:text-sm truncate block w-full">-</span>
                            </div>
                            <div class="bg-dark-input p-2.5 rounded-xl border border-dark-border">
                                <span class="text-[9px] text-gray-500 font-bold uppercase tracking-wider block mb-1">Masa Aktif</span>
                                <span id="resExp" class="font-bold text-white text-xs md:text-sm truncate block w-full">-</span>
                            </div>
                            <!-- Tambahan Masa Tenggang Sesuai Request -->
                            <div class="bg-dark-input p-2.5 rounded-xl border border-red-500/20">
                                <span class="text-[9px] text-red-400/80 font-bold uppercase tracking-wider block mb-1">Masa Tenggang</span>
                                <span id="resGrace" class="font-bold text-red-400 text-xs md:text-sm truncate block w-full">-</span>
                            </div>
                        </div>
                    </div>

                    <!-- Container Paket Aktif (Support Multi Paket Akrab/Lainnya) -->
                    <div class="bg-dark-card p-4 rounded-2xl border border-dark-border shadow-lg w-full">
                        <h2 class="text-sm font-bold text-white mb-3 border-b border-dark-border pb-2 flex items-center gap-2">
                            <i class="fa-solid fa-box-open text-brand-main"></i> Rincian Paket Aktif
                        </h2>
                        <div id="packagesContainer" class="flex flex-col gap-4 w-full">
                            <!-- Paket di-load via JS -->
                        </div>
                    </div>

                </div>
            </div> <!-- Akhir Tab Cek Kuota -->

        </div>
    </div>

    <script>
        // Data Mockup Preview
        const mockDataPreview = {
            "success":true,"code":"000","message":"Sukses",
            "data":{
                "subs_info":{
                    "msisdn":"6287812345678",
                    "operator":"XL",
                    "exp_date":"06-03-2037",
                    "grace_until":"31-12-2035" 
                },
                "package_info":{
                    "error_message":null,
                    "packages":[
                        {
                            "name":"SuperMini",
                            "expiry":"31-12-2049",
                            "quotas":[
                                {"name":"Kuota Bersama","percent":80,"total":"15GB","remaining":"12GB"},
                                {"name":"Kuota Pribadi","percent":50,"total":"2GB","remaining":"1GB"}
                            ]
                        },
                        {
                            "name":"Extra Kuota Tiktok",
                            "expiry":"31-12-2024",
                            "quotas":[
                                {"name":"Kuota Tiktok 24 Jam","percent":20,"total":"5GB","remaining":"1GB"}
                            ]
                        }
                    ]
                }
            }
        };

        const mockStokPreview = {
            "success": true,
            "data": [
                { "sku": "XLA14", "nama": "SuperMini", "stok": "71" },
                { "sku": "XLA20", "nama": "SuperMini V2", "stok": "0" },
                { "sku": "XLA32", "nama": "Mini", "stok": "282" },
                { "sku": "XLA39", "nama": "Big", "stok": "816" },
                { "sku": "XLA48", "nama": "Big V2", "stok": "247" },
                { "sku": "XLA55", "nama": "Jumbo V2", "stok": "515" },
                { "sku": "XLA64", "nama": "Jumbo V3", "stok": "349" },
                { "sku": "XLA65", "nama": "JUMBO", "stok": "0" },
                { "sku": "XLA77", "nama": "Megabig V2", "stok": "306" },
                { "sku": "XLA89", "nama": "MegaBig", "stok": "317" }
            ]
        };

        // --- Logika Tab ---
        const tabBtnKuota = document.getElementById('tabBtnKuota');
        const tabBtnStok = document.getElementById('tabBtnStok');
        const tabContentKuota = document.getElementById('tabContentKuota');
        const tabContentStok = document.getElementById('tabContentStok');

        function switchTab(activeBtn, inactiveBtn, activeContent, inactiveContent) {
            activeBtn.classList.add('text-brand-main', 'border-brand-main', 'bg-brand-main/5');
            activeBtn.classList.remove('text-gray-500', 'border-transparent', 'hover:text-gray-300');
            inactiveBtn.classList.remove('text-brand-main', 'border-brand-main', 'bg-brand-main/5');
            inactiveBtn.classList.add('text-gray-500', 'border-transparent', 'hover:text-gray-300');
            
            activeContent.classList.remove('hidden');
            inactiveContent.classList.add('hidden');
            
            if(activeContent.id === 'tabContentStok' || activeContent.id === 'tabContentKuota') {
                activeContent.classList.add('flex');
            }
            inactiveContent.classList.remove('flex');
        }

        tabBtnKuota.addEventListener('click', () => switchTab(tabBtnKuota, tabBtnStok, tabContentKuota, tabContentStok));
        tabBtnStok.addEventListener('click', () => switchTab(tabBtnStok, tabBtnKuota, tabContentStok, tabContentKuota));

        // --- Logika Cek Kuota (Membaca Multi Paket) ---
        document.getElementById('cekForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const nomor = document.getElementById('inputNomor').value;
            const loading = document.getElementById('loading');
            const errorMsg = document.getElementById('errorMsg');
            const resultArea = document.getElementById('resultArea');
            const btnSubmit = document.getElementById('btnSubmit');
            const btnIcon = btnSubmit.querySelector('i');

            errorMsg.classList.add('hidden');
            resultArea.classList.add('hidden');
            resultArea.classList.remove('flex');
            loading.classList.remove('hidden');
            loading.classList.add('flex');
            btnSubmit.disabled = true;
            btnSubmit.classList.add('opacity-70');
            btnIcon.className = 'fa-solid fa-spinner fa-spin ml-1 text-sm';

            try {
                let responseData;
                const isVercel = window.location.hostname.includes('vercel.app') || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
                
                if (isVercel) {
                    const response = await fetch(`/api/checker?number=${nomor}`);
                    if (!response.ok) throw new Error("Gagal");
                    responseData = await response.json();
                } else {
                    await new Promise(r => setTimeout(r, 1000));
                    responseData = mockDataPreview; 
                    responseData.data.subs_info.msisdn = nomor;
                }

                if (responseData.data && responseData.data.subs_info) {
                    const info = responseData.data.subs_info;
                    const packagesArray = responseData.data.package_info.packages;

                    document.getElementById('resNomor').textContent = info.msisdn || '-';
                    document.getElementById('resOperator').textContent = info.operator || '-';
                    document.getElementById('resExp').textContent = info.exp_date || '-';
                    document.getElementById('resGrace').textContent = info.grace_until || '-';

                    const packagesContainer = document.getElementById('packagesContainer');
                    packagesContainer.innerHTML = ''; 

                    // Looping SEMUA paket aktif
                    if (packagesArray && packagesArray.length > 0) {
                        packagesArray.forEach(paket => {
                            let packageHTML = `
                                <div class="bg-dark-input p-3 rounded-xl border border-dark-border w-full">
                                    <div class="flex justify-between items-center mb-3 pb-2 border-b border-dark-border/50">
                                        <h3 class="text-xs md:text-sm font-bold text-white flex items-center gap-2 truncate">
                                            <i class="fa-solid fa-tag text-brand-main text-[10px]"></i> ${paket.name}
                                        </h3>
                                        <span class="text-[9px] md:text-[10px] text-gray-400 bg-dark-bg px-2 py-1 rounded whitespace-nowrap ml-2">Exp: ${paket.expiry}</span>
                                    </div>
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 w-full">
                            `;
                            
                            if (paket.quotas && paket.quotas.length > 0) {
                                paket.quotas.forEach(kuota => {
                                    const percent = kuota.percent || 100;
                                    let barColor = percent <= 20 ? 'bg-red-500 shadow-[0_0_5px_rgba(239,68,68,0.5)]' : 
                                                  (percent <= 50 ? 'bg-yellow-400 shadow-[0_0_5px_rgba(250,204,21,0.5)]' : 'bg-brand-main shadow-[0_0_5px_rgba(0,244,126,0.5)]');
                                    packageHTML += `
                                        <div class="bg-dark-bg border border-dark-border rounded-lg p-2.5 w-full">
                                            <h4 class="text-[10px] md:text-xs text-gray-200 mb-1.5 truncate w-full">${kuota.name}</h4>
                                            <div class="flex justify-between items-end mb-1.5">
                                                <span class="text-xs md:text-sm font-extrabold text-brand-main leading-none">${kuota.remaining}</span>
                                                <span class="text-[9px] md:text-[10px] text-gray-400">Total: ${kuota.total}</span>
                                            </div>
                                            <div class="w-full bg-dark-input rounded-full h-1.5 border border-white/5">
                                                <div class="${barColor} h-1.5 rounded-full" style="width: ${percent}%"></div>
                                            </div>
                                        </div>
                                    `;
                                });
                            }
                            packageHTML += `</div></div>`;
                            packagesContainer.insertAdjacentHTML('beforeend', packageHTML);
                        });
                    } else {
                        packagesContainer.innerHTML = `<div class="text-xs text-gray-500 italic p-3 text-center w-full">Tidak ada paket aktif terdeteksi.</div>`;
                    }
                    
                    resultArea.classList.remove('hidden');
                    resultArea.classList.add('flex');
                } else { throw new Error("Invalid"); }
            } catch (error) {
                errorMsg.classList.remove('hidden');
                errorMsg.classList.add('flex');
            } finally {
                loading.classList.add('hidden');
                loading.classList.remove('flex');
                btnSubmit.disabled = false;
                btnSubmit.classList.remove('opacity-70');
                btnIcon.className = 'fa-solid fa-arrow-right ml-1 text-sm';
            }
        });

        // --- Logika Stok Akrab ---
        async function loadStokData() {
            const loadingStok = document.getElementById('loadingStok');
            const btnCekStok = document.getElementById('btnCekStok');
            const btnIcon = btnCekStok.querySelector('i');

            loadingStok.classList.remove('hidden');
            loadingStok.classList.add('flex');
            btnIcon.classList.add('fa-spin');

            try {
                let responseData;
                const isVercel = window.location.hostname.includes('vercel.app') || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
                
                if (isVercel) {
                    const response = await fetch(`/api/stok-akrab`);
                    if (!response.ok) throw new Error("Gagal");
                    responseData = await response.json();
                } else {
                    await new Promise(r => setTimeout(r, 600));
                    responseData = mockStokPreview; 
                }

                const stokGrid = document.getElementById('stokGrid');
                stokGrid.innerHTML = ''; 
                let stockItems = [];
                let dataToParse = responseData.data || responseData;

                const kamusPaket = {
                    'XLA14': 'SuperMini', 'XLA20': 'SuperMini V2', 'XLA32': 'Mini', 
                    'XLA39': 'Big', 'XLA48': 'Big V2', 'XLA55': 'Jumbo V2', 
                    'XLA64': 'Jumbo V3', 'XLA65': 'JUMBO', 'XLA77': 'Megabig V2', 'XLA89': 'MegaBig'
                };

                const detailAreaPaket = {
                    "SuperMini": [{ area: "Area1", quota: "13-15 GB" }, { area: "Area2", quota: "15-17 GB" }, { area: "Area3", quota: "20-22 GB" }, { area: "Area4", quota: "30-32 GB" }],
                    "SuperMini V2": [{ area: "Area1", quota: "19-21 GB" }, { area: "Area2", quota: "21-23 GB" }, { area: "Area3", quota: "26-28 GB" }, { area: "Area4", quota: "36-38 GB" }],
                    "Mini": [{ area: "Area1", quota: "31-32 GB" }, { area: "Area2", quota: "33-34 GB" }, { area: "Area3", quota: "38-39 GB" }, { area: "Area4", quota: "48-49 GB" }],
                    "Big": [{ area: "Area1", quota: "38-40 GB" }, { area: "Area2", quota: "40-42 GB" }, { area: "Area3", quota: "45-47 GB" }, { area: "Area4", quota: "55-57 GB" }],
                    "Big V2": [{ area: "Area1", quota: "48 GB" }, { area: "Area2", quota: "50 GB" }, { area: "Area3", quota: "55 GB" }, { area: "Area4", quota: "65 GB" }],
                    "Jumbo V2": [{ area: "Area1", quota: "55 GB" }, { area: "Area2", quota: "57 GB" }, { area: "Area3", quota: "62 GB" }, { area: "Area4", quota: "72 GB" }],
                    "Jumbo V3": [{ area: "Area1", quota: "63-65 GB" }, { area: "Area2", quota: "65-67 GB" }, { area: "Area3", quota: "70-72 GB" }, { area: "Area4", quota: "80-82 GB" }],
                    "JUMBO": [{ area: "Area1", quota: "65 GB" }, { area: "Area2", quota: "70 GB" }, { area: "Area3", quota: "83 GB" }, { area: "Area4", quota: "123 GB" }],
                    "Megabig V2": [{ area: "Area1", quota: "76-78 GB" }, { area: "Area2", quota: "78-80 GB" }, { area: "Area3", quota: "83-85 GB" }, { area: "Area4", quota: "93-95 GB" }],
                    "MegaBig": [{ area: "Area1", quota: "88-90 GB" }, { area: "Area2", quota: "90-92 GB" }, { area: "Area3", quota: "95-97 GB" }, { area: "Area4", quota: "105-107 GB" }]
                };

                if (Array.isArray(dataToParse)) {
                    stockItems = dataToParse.map(item => {
                        let valCode = item.sku || item.kode || item.code || item.id || '-';
                        let valStock = item.stok || item.stock || item.qty || null;
                        let valName = item.nama || item.name || '';
                        if (!valName || valName === valStock) valName = kamusPaket[valCode] || valCode;
                        let numStock = typeof valStock === 'string' ? (parseInt(valStock.replace(/\D/g, '')) || 0) : parseInt(valStock || 0);
                        return { code: valCode, name: valName, stock: valStock, numStock: numStock };
                    });
                }

                if (stockItems.length > 0) {
                    stockItems.forEach(item => {
                        const isAvailable = item.numStock > 0 || String(item.stock).toLowerCase().includes('tersedia');
                        const stockColor = isAvailable ? 'text-brand-main' : 'text-red-500';
                        const bgHover = isAvailable ? 'border-dark-border' : 'border-dark-border'; 
                        
                        // Icon dan ukuran teks diperbesar agar lebih jelas dan mengisi ruang kosong
                        const checkIcon = isAvailable 
                            ? `<div class="bg-brand-main rounded-full w-3.5 h-3.5 md:w-4 md:h-4 flex items-center justify-center shadow-[0_0_8px_rgba(0,244,126,0.5)]"><i class="fa-solid fa-check text-[#0b1a24] text-[7px] md:text-[9px] font-black"></i></div>`
                            : `<div class="bg-red-500 rounded-full w-3.5 h-3.5 md:w-4 md:h-4 flex items-center justify-center shadow-[0_0_8px_rgba(239,68,68,0.5)]"><i class="fa-solid fa-xmark text-[#0b1a24] text-[7px] md:text-[9px] font-black"></i></div>`;
                        
                        const emptyText = !isAvailable ? `<span class="block text-red-500 text-[7px] md:text-[9px] italic font-black tracking-wider leading-none mt-1">HABIS</span>` : '';

                        let baseNameForArea = item.name.replace(' (Promo)', '').trim();
                        if(baseNameForArea.toLowerCase() === 'megabig v2') baseNameForArea = 'Megabig V2'; 
                        if(baseNameForArea.toLowerCase() === 'megabig') baseNameForArea = 'MegaBig'; 
                        
                        let areaHTML = '';
                        const areas = detailAreaPaket[baseNameForArea];
                        if (areas) {
                            areas.forEach(a => {
                                // Teks area diperbesar agar seimbang
                                areaHTML += `
                                    <div class="flex justify-between items-center w-full">
                                        <span class="text-[7.5px] md:text-[10px] text-gray-500 font-medium leading-[1.3] tracking-wide">${a.area}</span>
                                        <span class="text-[#e8b923] text-[7.5px] md:text-[10px] font-bold leading-[1.3]">${a.quota}</span>
                                    </div>`;
                            });
                        }

                        // Padding ditambah (p-2.5) dan gap elemen diperbesar
                        const card = `
                            <div class="bg-dark-input p-2.5 md:p-3 rounded-xl border ${bgHover} flex flex-col w-full relative shadow-sm">
                                <!-- Judul Paket -->
                                <div class="flex justify-between items-start gap-1 relative z-10 mb-1.5">
                                    <h3 class="font-bold text-white text-[11px] md:text-sm leading-none truncate tracking-tight">${item.name}</h3>
                                    <div class="shrink-0 mt-[1px]">${checkIcon}</div>
                                </div>
                                
                                <!-- Sisa Stok -->
                                <div class="relative z-10 mb-2">
                                    <div class="flex items-center gap-1">
                                        <span class="text-white font-bold text-[8.5px] md:text-[11px] leading-none">Stok:</span>
                                        <span class="text-[13px] md:text-[16px] font-extrabold ${stockColor} leading-none">${item.numStock}</span>
                                    </div>
                                    ${emptyText}
                                </div>
                                
                                <!-- Area Kuota -->
                                <div class="flex flex-col justify-center gap-1 w-full relative z-10 mt-1 mb-2">
                                    ${areaHTML}
                                </div>
                                
                                <!-- Kode Paket -->
                                <div class="pt-1.5 border-t border-[#1a3245] flex justify-between items-center w-full relative z-10 mt-auto">
                                    <span class="text-[7.5px] md:text-[10px] text-gray-600 font-bold tracking-wider leading-none">KODE</span>
                                    <span class="text-brand-main text-[8.5px] md:text-[11px] font-bold tracking-wider leading-none">${item.code}</span>
                                </div>
                            </div>
                        `;
                        stokGrid.insertAdjacentHTML('beforeend', card);
                    });
                }
            } catch (error) {
                console.error(error);
            } finally {
                loadingStok.classList.add('hidden');
                loadingStok.classList.remove('flex');
                btnIcon.classList.remove('fa-spin');
            }
        }

        document.getElementById('btnCekStok').addEventListener('click', loadStokData);
        window.addEventListener('DOMContentLoaded', loadStokData);

        // --- Logika Animasi Running Text ---
        function generateFakeTransactions() {
            const names = ["Budi", "Andi", "Siti", "Ayu", "Agus", "Dewi", "Reza", "Putri", "Dedi", "Rina", "Eko", "Lia", "Rizky", "Fitri", "Dimas", "Nova", "Hendra"];
            
            // Nama Paket Sesuai Kamus
            const packages = ["SuperMini", "SuperMini V2", "Mini", "Big", "Big V2", "Jumbo V2", "Jumbo V3", "JUMBO", "Megabig V2", "MegaBig"]; 
            
            // Nomor Prefix XL/Axis
            const prefixes = ["0817", "0818", "0819", "0859", "0877", "0878", "0831", "0832", "0833", "0838"];
            
            let marqueeHTML = "";
            for (let i = 0; i < 60; i++) {
                let name = names[Math.floor(Math.random() * names.length)];
                let pkg = packages[Math.floor(Math.random() * packages.length)];
                let prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
                
                let maskedName = name.substring(0, 2) + "**";
                let phone = `${prefix}****${Math.floor(1000 + Math.random() * 9000)}`;
                
                marqueeHTML += `<span class="mx-3 md:mx-4 text-[9px] md:text-[11px] text-gray-400 font-medium tracking-wide flex items-center h-full"><i class="fa-solid fa-cart-shopping text-brand-main mr-1.5"></i><span class="text-gray-200">${maskedName}</span> &nbsp;<span class="opacity-70">(${phone})</span>&nbsp; sukses membeli &nbsp;<span class="text-brand-main font-bold">${pkg}</span></span><span class="text-dark-border text-[7px] flex items-center h-full">●</span>`;
            }
            document.getElementById('runningTextContainer').innerHTML = marqueeHTML;
        }
        generateFakeTransactions();
    </script>
</body>
</html>
